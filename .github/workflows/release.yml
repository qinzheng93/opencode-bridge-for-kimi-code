name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
          - platform: macos-arm64
            runner: macos-26
            target: aarch64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Run target tests
        run: cargo test --locked --target "${{ matrix.target }}"
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Check binary
        env:
          BINARY: target/${{ matrix.target }}/release/ocbk
        run: |
          file "$BINARY"
          "$BINARY" --version
      - name: Verify static Linux binary
        if: runner.os == 'Linux'
        env:
          BINARY: target/${{ matrix.target }}/release/ocbk
        run: file "$BINARY" | grep --extended-regexp 'statically linked|static-pie linked'
      - name: Package binary
        env:
          ASSET: ocbk-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
          BINARY: target/${{ matrix.target }}/release/ocbk
        run: |
          mkdir package
          cp "$BINARY" package/ocbk
          cp LICENSE README.md package/
          tar -C package -czf "$ASSET" ocbk LICENSE README.md
      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ocbk-${{ matrix.platform }}
          path: ocbk-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
